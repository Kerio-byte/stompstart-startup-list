name: Expand
tagline: Reading glasses for your AI agent — fetch and crawl with SOTA extraction
description: >-
  Expand lets AI agents fetch web pages and crawl with state-of-the-art
  extraction. Its model Iris looks at the rendered page and returns it whole
  as markdown, with every line linked back to its exact spot on the page.
  Other tools read the HTML and guess; Expand returns clean, structured
  content with provenance. The platform provides an MCP server, a CLI
  (expandai), and an API for programmatic use.
problem: >-
  AI agents need to read the web, but raw HTML is noisy and hard to parse
  reliably. Existing fetch tools return unstructured content that agents
  struggle to interpret, leading to hallucinated or incomplete readings.
audience:
  - AI agent developers
  - Teams building autonomous agents
  - Researchers needing reliable web content extraction
