name: Ledge
tagline: Runnable Markdown notes for developers and DevOps
description: >-
  Ledge is a Markdown editor that lets developers and DevOps engineers run
  code blocks in place and see the output stream in directly beneath each
  block. It is free and open source, available for Mac, Linux, Windows,
  iPhone, and Android.
problem: Developers switch between Markdown notes and a terminal to run code and see results.
